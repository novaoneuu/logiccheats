<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logic Cheats</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0a1020, #0d2346, #060b16);
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 120, 255, 0.28), transparent 70%);
      filter: blur(70px);
      top: -200px;
      left: -200px;
      pointer-events: none;
    }

    .glow2 {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(0, 70, 200, 0.25), transparent 70%);
      filter: blur(90px);
      bottom: -250px;
      right: -250px;
      pointer-events: none;
    }

    .container {
      text-align: center;
      padding: 60px 30px;
      width: 100%;
      max-width: 900px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 85px;
      font-weight: 800;
      letter-spacing: -2px;
      color: #0077ff;
      margin-bottom: 80px;
      text-shadow: 0px 0px 45px rgba(0, 120, 255, 0.25);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 22px;
      flex-wrap: wrap;
    }

<style>
  .btn {
    width: 190px;
    height: 52px;
    justify-content: center;
    padding: 0;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.35s ease;
    display: flex;
    align-items: center;
    gap: 10px;
    border: none;
  }

  .btn:hover {
    transform: scale(1.08);
  }

  /* EXPLORE (blue main glow) */
  .btn-explore {
    background: #0077ff;
    color: #111;
    box-shadow: 0 0 14px rgba(0, 119, 255, 0.25);
  }

  .btn-explore:hover {
    box-shadow: 0 0 30px rgba(0, 119, 255, 0.6);
  }

  /* SUPPORT (separate dark glow, no blue influence) */
  .btn-support {
    background: rgba(10, 10, 10, 0.9);
    color: #ffffff;
    box-shadow: 0 0 14px rgba(0, 0, 0, 0.6);
  }

  .btn-support:hover {
    box-shadow: 0 0 28px rgba(0, 0, 0, 0.85);
  }

  .arrow {
    font-size: 18px;
    font-weight: 800;
  }
</style>
</head>

<body>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="container">
    <h1>Logic Cheats</h1>

    <div class="buttons">
  <button class="btn btn-explore" onclick="window.location.href='/home'">
    Explore <span class="arrow">→</span>
  </button>

  <button class="btn btn-support" onclick="window.location.href='/support'">
    Support
  </button>
    </div>
  </div>
</body>
</html>
