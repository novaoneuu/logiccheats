<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logic Cheats</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #05070e, #07152c, #02040a);
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(120,200,255,0.25), transparent 70%);
      filter: blur(40px);
      top: -150px;
      left: -150px;
      pointer-events: none;
    }

    .glow2 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,0,0,0.6), transparent 70%);
      filter: blur(60px);
      bottom: -200px;
      right: -200px;
      pointer-events: none;
    }

    .container {
      text-align: center;
      padding: 60px 30px;
      width: 100%;
      max-width: 900px;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 80px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(90deg, #86d6ff, #0a0a0a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 16px;
      color: #2b2f38;
      font-weight: 600;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0px 10px 30px rgba(0,0,0,0.35);
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-explore {
      background: #86d6ff;
      color: #111111;
    }

    .btn-support {
      background: #0a0a0a;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .arrow {
      font-size: 18px;
      font-weight: 800;
    }

    .card {
      margin-top: 50px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 22px;
      padding: 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0px 20px 50px rgba(0,0,0,0.55);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .card p {
      color: #2b2f38;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 52px;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }

      .buttons {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="container">
    <h1>Logic Cheats</h1>
    <div class="subtitle">clean tools. smart shortcuts. zero nonsense.</div>

    <div class="buttons">
      <button class="btn btn-explore" onclick="window.location.href='#explore'">
        Explore <span class="arrow">→</span>
      </button>

      <button class="btn btn-support" onclick="window.location.href='#support'">
        Support
      </button>
    </div>

    <div class="card">
      <p>
        Welcome to Logic Cheats — a sleek hub built for speed and simplicity.
        Explore resources, tools, and support options in one clean space.
      </p>
    </div>
  </div>
</body>
</html>
